<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Switch</title>
<style>body{margin:0;padding:16px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}</style>
</head><body><div id="root"></div>
<script>
(function () {
  const NS = window.QueerLeagueDesignSystem_ae47b3;
  const {
    Switch
  } = NS;
  function Demo() {
    const [on, setOn] = React.useState(true);
    return React.createElement(Switch, {
      label: "Spielerinnerungen",
      description: "Push 24 h vor Anpfiff",
      checked: on,
      onChange: e => setOn(e.target.checked)
    });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Demo, null));
})();
</script></body></html>
