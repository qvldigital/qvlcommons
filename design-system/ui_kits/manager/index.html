<!-- @dsCard group="Manager" viewport="900x760" name="Queer League Manager" subtitle="PWA — login, team dashboard, Kader, Spielberichtsbogen" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Queer League Manager</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:var(--surface-page);padding:24px;font-family:var(--font-body)}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:390px;height:712px;background:var(--surface-page);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:6px 6px 0 0 var(--qvl-petrol);border:3px solid var(--qvl-petrol)}
.phone .scroll{flex:1;overflow-y:auto}
.cap{font-family:var(--font-display);letter-spacing:.14em;text-transform:uppercase;font-size:var(--text-eyebrow);color:var(--text-muted);margin:0 0 8px 2px}</style>
</head><body><div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Roster.jsx"></script>
<script type="text/babel" src="Spielbericht.jsx"></script>
<script type="text/babel" data-presets="react">
(function(){
const {BottomNav,Icon,SiteHeader}=window.QueerLeagueDesignSystem_ae47b3;
function Phone({label,children}){
  return <div><p className="cap">{label}</p><div className="phone">{children}</div></div>;
}
function AppShell(){
  const [tab,setTab]=React.useState("start");
  const go=(t)=>setTab(t);
  return <div className="phone">
    <SiteHeader compact items={[{value:"start",label:"Start"},{value:"spiele",label:"Spiele"},{value:"kader",label:"Kader"}]}
      active={tab} onNavigate={go} language="DE"/>
    <div className="scroll">
      {tab==="start"?<window.Dashboard go={go}/>:null}
      {tab==="kader"?<window.Roster/>:null}
      {tab==="bericht"||tab==="spiele"?<window.Spielbericht/>:null}
      {tab==="mehr"?<div style={{padding:"var(--space-6)"}}><h2>Mehr</h2><p>Einstellungen, Sprache, Safe-Space-Regeln, Abmelden.</p></div>:null}
    </div>
    <BottomNav value={tab==="bericht"?"spiele":tab} onChange={go} items={[
      {value:"start",label:"Start",icon:<Icon name="house" size={20}/>},
      {value:"spiele",label:"Spiele",icon:<Icon name="calendar-days" size={20}/>},
      {value:"kader",label:"Kader",icon:<Icon name="users" size={20}/>},
      {value:"mehr",label:"Mehr",icon:<Icon name="ellipsis" size={20}/>}]}/>
  </div>;
}
function App(){
  const [logged,setLogged]=React.useState(false);
  return <div className="stage">
    {logged?null:<Phone label="Login"><div className="scroll"><window.Login onLogin={()=>setLogged(true)}/></div></Phone>}
    <div><p className="cap">{logged?"App":"App (nach Login)"}</p><AppShell/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
})();
</script></body></html>
