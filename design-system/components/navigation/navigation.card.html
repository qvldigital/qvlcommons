<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>QVL card</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:var(--surface-page);padding:16px;font-family:var(--font-body)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}</style>
</head><body><div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NS=window.QueerLeagueDesignSystem_ae47b3;

const {SiteHeader,Tabs,Breadcrumb,BottomNav,SiteFooter,Icon}=NS;
function Demo(){
  const [t,setT]=React.useState('tabelle');
  const [b,setB]=React.useState('spiele');
  return <div className="col" style={{gap:16}}>
    <SiteHeader items={[{value:'liga',label:'Liga'},{value:'turniere',label:'Turniere'},{value:'fame',label:'Wall of Fame'}]} active="liga" cta="Mitmachen"/>
    <Tabs items={[{value:'plan',label:'Spielplan'},{value:'tabelle',label:'Tabelle',count:14},{value:'erg',label:'Ergebnisse'}]} value={t} onChange={setT}/>
    <Breadcrumb items={[{value:'liga',label:'Liga'},{value:'b',label:'Level B'},'Gruppe Nord']}/>
    <BottomNav value={b} onChange={setB} items={[
      {value:'start',label:'Start',icon:<Icon name="house" size={20}/>},
      {value:'spiele',label:'Spiele',icon:<Icon name="calendar-days" size={20}/>},
      {value:'team',label:'Team',icon:<Icon name="users" size={20}/>},
      {value:'mehr',label:'Mehr',icon:<Icon name="ellipsis" size={20}/>}]}/>
    <SiteFooter note="Queer Volleyball League e.V. — seit 1992 europaweit am Netz." columns={[
      {title:'Liga',links:['Spielplan','Tabellen','Regelwerk']},
      {title:'Community',links:['Mitmachen','Wall of Fame','Kontakt']}]} style={{padding:'24px 20px'}}/>
  </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
