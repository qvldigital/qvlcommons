<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>QVL card</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:var(--surface-page);padding:16px;font-family:var(--font-body)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}</style>
</head><body><div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NS=window.QueerLeagueDesignSystem_ae47b3;

const {Input,Select,Checkbox,Radio,RadioGroup,Switch}=NS;
function Demo(){
  const [on,setOn]=React.useState(true);
  const [k,setK]=React.useState('flinta');
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px'}}>
    <div className="col">
      <Input label="Teamname" defaultValue="Berlin Bumpers" required hint="So erscheint das Team im Spielplan."/>
      <Input label="E-Mail" error="Bitte gültige Adresse angeben." defaultValue="kontakt@"/>
      <Select label="Level" options={["A","B","C","D"]} placeholder="Bitte wählen"/>
    </div>
    <div className="col">
      <Checkbox label="FLINTA*-Spielklasse" description="Kann pro Saison geändert werden." defaultChecked/>
      <Checkbox label="Senior*innen-Klasse"/>
      <RadioGroup legend="Spielklasse">
        <Radio name="k" label="Offene Liga" checked={k==='offen'} onChange={()=>setK('offen')}/>
        <Radio name="k" label="FLINTA*" checked={k==='flinta'} onChange={()=>setK('flinta')}/>
      </RadioGroup>
      <Switch label="Spielerinnerungen" description="Push 24 h vor Anpfiff" checked={on} onChange={e=>setOn(e.target.checked)}/>
    </div>
  </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
