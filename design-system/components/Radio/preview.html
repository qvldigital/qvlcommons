<!-- @dsCard group="Forms" height=150 subtitle="Radio buttons inside a RadioGroup" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Radio</title>
<style>body{margin:0;padding:16px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}</style>
</head><body><div id="root"></div>
<script>
(function () {
  const NS = window.QueerLeagueDesignSystem_ae47b3;
  const {
    Radio,
    RadioGroup
  } = NS;
  function Demo() {
    const [k, setK] = React.useState('flinta');
    return React.createElement(RadioGroup, {
      legend: "Spielklasse"
    }, React.createElement(Radio, {
      name: "k",
      label: "Offene Liga",
      checked: k === 'offen',
      onChange: () => setK('offen')
    }), React.createElement(Radio, {
      name: "k",
      label: "FLINTA*",
      checked: k === 'flinta',
      onChange: () => setK('flinta')
    }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Demo, null));
})();
</script></body></html>
