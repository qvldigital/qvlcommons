<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}
.wrap{display:flex;width:100vw;height:100vh}
.main{flex:1;background:#006666;display:flex;align-items:center;justify-content:center;padding:4%}
.plate{background:#fff;padding:5% 6%;width:86%;box-sizing:border-box;clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 28px,100% calc(100% - 28px),calc(100% - 28px) 100%,28px 100%,0 calc(100% - 28px),0 28px)}
.plate img{width:100%;display:block}
.strip{width:25%;display:flex;flex-direction:column}
.strip div{flex:1}</style></head><body>
<div class="wrap"><div class="main"><div class="plate"><img src="assets/logo/qvl-logo-long-petrol-orange.png" alt="Queer Volleyball League"></div></div>
<div class="strip"><div style="background:#FFFF00"></div><div style="background:#FF6600"></div><div style="background:#4C9393"></div><div style="background:#D04E97"></div></div></div>
</body></html>
