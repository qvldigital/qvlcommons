<!-- @dsCard group="Colors" viewport="700x150" name="Orange tints" subtitle="Backgrounds only — body text never sits on full orange" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-card);font-family:var(--font-body);font-weight:300}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:96px}
.sw b{font-family:var(--font-display);font-size:15px;letter-spacing:.02em;text-transform:uppercase;font-weight:400;display:block}
.sw span{font-size:11px;letter-spacing:.06em}
.row{display:flex;gap:8px}.lbl{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="row"><div class="sw" style="background:#FF6600;color:#fff"><b>Orange</b><span>#FF6600</span></div>
<div class="sw" style="background:#FFA366;color:#006666"><b>Orange Mid</b><span>#FFA366</span></div>
<div class="sw" style="background:#FFC199;color:#006666"><b>Orange Pale</b><span>#FFC199</span></div></div></body></html>
