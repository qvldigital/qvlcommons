<!-- @dsCard group="Colors" viewport="700x150" name="Yellow rule" subtitle="Gelb #FFFF00 is a border and focus ring — never a fill behind text" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-card);font-family:var(--font-body);font-weight:300}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:96px}
.sw b{font-family:var(--font-display);font-size:15px;letter-spacing:.02em;text-transform:uppercase;font-weight:400;display:block}
.sw span{font-size:11px;letter-spacing:.06em}
.row{display:flex;gap:8px}.lbl{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="row" style="align-items:stretch">
<div style="flex:1;background:#fff;padding:14px;box-shadow:inset 0 0 0 3px #FFFF00;display:flex;flex-direction:column;gap:6px">
<span class="lbl" style="color:#006666">Richtig</span><span style="font-size:14px;color:#1A1A1A">Gelber Fokusring, Text auf Weiß.</span></div>
<div style="flex:1;background:#FFFF00;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative">
<span class="lbl" style="color:#1A1A1A">Falsch</span><span style="font-size:14px;color:#fff">Text auf gelber Fläche.</span>
<span style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(0,0,0,.18) 10px 20px)"></span></div></div></body></html>
